<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma AIRS Agent Identity + AI Gateway — End-to-End Flow (GA1)</title>
<style>
:root{
  --bg:#0a0e16; --panel:#111826; --panel2:#0d1320; --line:#232d42; --line2:#2f3b55;
  --text:#e5e9f2; --muted:#8a96ad; --dim:#5b6780; --accent:#fa582d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"PingFang SC","PingFang TC","Apple SD Gothic Neo","Microsoft YaHei","Microsoft JhengHei","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;min-width:1200px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#141b2b,#0a0e16)}
header .logo{width:10px;height:28px;background:var(--accent);border-radius:2px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12px}
header .spacer{flex:1}
.ctrl{display:flex;gap:6px;align-items:center}
button,select{background:#18212f;color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
button:hover,select:hover{border-color:#4a5878;background:#1d2738}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;min-width:84px}
button.primary:hover{background:#ff6b42}
.toggle{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.toggle button{border:0;border-radius:0;background:#141c2a;color:var(--muted)}
.toggle button.on{background:#2a3550;color:#fff}
#phases{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto}
.ph{flex:1;min-width:104px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:#101724;color:var(--dim);font-size:11.5px;cursor:pointer;white-space:nowrap;transition:.2s}
.ph b{display:block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:inherit;opacity:.8}
.ph.done{color:var(--muted);border-color:#2a3550}
.ph.cur{color:#fff;border-color:var(--accent);background:#2a1610;box-shadow:0 0 0 1px var(--accent) inset}
.ph.deny.cur{border-color:#ef4444;background:#2a1013;box-shadow:0 0 0 1px #ef4444 inset}
#progress{height:3px;background:#151d2c}
#progress div{height:100%;background:var(--accent);width:0;transition:width .35s}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#lanes{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--line);background:var(--panel)}
.lane{padding:10px 6px 8px;text-align:center;border-right:1px solid #161f30;position:relative}
.lane:last-child{border-right:0}
.lane .badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;font-weight:700;font-size:12px;color:#0a0e16;margin-bottom:4px}
.lane .nm{font-weight:620;font-size:12.5px}
.lane .sb{color:var(--dim);font-size:10.5px}
.lane.active .badge{box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 18px currentColor}
.wallet{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:22px;margin-top:6px}
.tok{font-size:10px;padding:2px 6px;border-radius:10px;border:1px solid;white-space:nowrap;font-family:var(--mono);animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#diagram{flex:1;overflow:auto;position:relative}
#diagram svg{display:block}
#legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--panel2)}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{display:inline-block;width:26px;height:0;border-top:2px solid}
aside{width:440px;display:flex;flex-direction:column;background:var(--panel);min-height:0}
#detail{flex:1;overflow:auto;padding:16px 18px 24px}
.phase-title{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);font-weight:700}
.phase-desc{color:var(--muted);font-size:12.5px;margin:4px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.stepno{font-family:var(--mono);font-size:12px;color:var(--dim)}
h2{font-size:17px;margin:2px 0 8px;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10.5px;padding:2px 8px;border-radius:10px;border:1px solid;font-weight:600}
.desc{font-size:13.5px;color:#cfd6e4}
.desc ul{padding-left:18px;margin:6px 0}
.desc li{margin:3px 0}
.desc code,.note code{font-family:var(--mono);font-size:12px;background:#1a2336;padding:1px 5px;border-radius:4px;color:#e2e8f0}
.note{margin-top:12px;padding:9px 11px;border-left:3px solid #f59e0b;background:#221b0c;border-radius:0 6px 6px 0;font-size:12.5px;color:#f3e2bd}
.sec{margin-top:14px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);font-weight:700}
pre{margin:6px 0 0;background:#0a0f1a;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:11.5px/1.5 var(--mono);color:#c9d4e6;white-space:pre-wrap;word-break:break-all}
pre .k{color:#7dd3fc}pre .s{color:#a5e8b4}pre .c{color:#6b7891}pre .h{color:#fbbf24}
.claims-cap{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:600}
.claims-cap .dot{width:10px;height:10px;border-radius:50%}
.takeaways{margin-top:14px;padding:12px 14px;border:1px solid #3a2a20;background:#1b130e;border-radius:8px}
.takeaways h3{margin:0 0 6px;font-size:13px;color:var(--accent)}
.takeaways li{margin:5px 0;font-size:12.8px}
body.simple .tech{display:none!important}
#kbd{padding:8px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:11px}
#kbd kbd{font-family:var(--mono);background:#1a2336;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--muted)}
/* svg animation */
.msg-new .ln{animation:draw .75s ease-out forwards}
.msg-new .lbl{opacity:0;animation:fade .4s .35s forwards}
.msg-new .self{animation:pulse 1.2s ease-out}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%{opacity:0;transform:scale(.85)}40%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
.msg-old{opacity:.55}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>Agent → Idira (OBO) → AI Gateway → MCP Server → Microsoft Graph</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <select id="lang" title="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option></select>
    <div class="toggle"><button id="mSimple">Simple</button><button id="mDetail" class="on">Detailed</button></div>
    <select id="speed" title="Playback speed"><option value="1.6">0.6×</option><option value="1" selected>1×</option><option value="0.6">1.6×</option><option value="0.35">3×</option></select>
    <button id="bRestart" title="Restart (Home)">⟲</button>
    <button id="bPrev" title="Previous (←)">◀</button>
    <button id="bPlay" class="primary" title="Play / pause (Space)">▶ Play</button>
    <button id="bNext" title="Next (→)">▶</button>
  </div>
</header>
<div id="phases"></div>
<div id="progress"><div></div></div>
<main>
  <section id="stage">
    <div id="lanes"></div>
    <div id="diagram"></div>
    <div id="legend"></div>
  </section>
  <aside>
    <div id="detail"></div>
    <div id="kbd"></div>
  </aside>
</main>

  {t:'CIE 目录同步（用户 + 组）',title:'通过 Cloud Identity Engine 将 Entra 用户和组同步到 AI Gateway',desc:'Entra ID 要<b>第二次</b>对接，这次是对接 Cloud Identity Engine（CIE），这样 AIS 策略才能引用用户和组（例如 <i>Finance users</i>）。在 SCM 中配置：<b>AI Security → AI Gateway → Admin Settings → Authentication → Configure in CIE</b>。CIE 每 5 分钟同步一次。',note:'Idira 和 CIE 彼此不通信。两者对接同一个 Entra 租户，且必须使用<b>相同的用户属性</b>（userPrincipalName），否则 Gateway 无法把 token 中的用户与策略中的用户对应起来。新建用户最多需要 5 分钟才能被识别。'},

  {t:'登入記錄',title:'Entra ID 登入記錄',desc:'<ul><li><b>互動式</b>：alice → Idira（SAML），含 MFA / 條件式存取結果</li><li><b>非互動式</b>：alice → AI Gateway – MCP client（Leg 2、更新）</li><li><b>非互動式</b>：alice → MCP Server API → Microsoft Graph（OBO）</li></ul>依使用者（oid）與時間和 SCM、Gateway 記錄關聯。'} ],
 takeaways:`<li><b>只有一次互動式登入。</b>使用者在 Leg 1 中經 Idira（SAML）登入 Entra 一次，Leg 2 與 Graph 存取透過 Entra SSO 和 OBO 重複使用這次登入。</li>
<li><b>四個 token，四個對象，沒有一個被轉送到自己的對象之外：</b>GW token（agent → GW）· Idira token（留在 GW）· MCP token（GW → MCP）· Graph token（MCP → Graph）。</li>
<li><b>Agent 身分在 Gateway 上執行</b>，展現在原則與稽核中。下游 token 攜帶的是使用者（+ Gateway / MCP 應用程式），而不是 agent，因為 GA1 沒有 token 交換。</li>
<li><b>拒絕發生在使用任何後端憑證之前。</b>agent 從不持有 Entra、MCP 或 Graph 憑證。</li>
<li><b>需在 PoC 中驗證：</b>Entra 作為 Leg 2 的 MCP 授權伺服器（scope 與 <code>resource</code>、預先註冊用戶端），以及 GW token 的格式與有效期。</li>`
},

 phases:[
  ['관리자 사전 구성','1회성 관리자 구성. Idira, MCP Server, Microsoft Graph 모두 동일한 Entra ID 테넌트(contoso.onmicrosoft.com)를 신뢰합니다.'],
  ['에이전트 등록','Strata Cloud Manager에서 등록하면 에이전트는 Idira에 영구 ID와 OAuth 클라이언트 자격 증명을 얻습니다.'],
  ['디스커버리','MCP 권한 부여 디스커버리: 에이전트는 AI Gateway가 자신의 권한 부여 서버임을 알게 됩니다. Idira나 Entra와 직접 통신하지 않습니다.'],
  ['Leg 1 · Idira OBO 로그인','OAuth 2.1 인가 코드 + PKCE. Gateway가 에이전트의 요청을 Idira로 중개하고, Idira는 SAML로 Entra ID에서 사용자를 인증합니다. 결과: 사용자 + 에이전트(on-behalf-of)를 묶은 Idira 토큰.'],
  ['Gateway 권한 부여','Gateway가 이 사용자 + 에이전트 조합이 접근할 수 있는 범위를 결정하고, 사용자가 동의합니다.'],
  ['Leg 2 · MCP 로그인','같은 로그인 흐름 안에서 동의 이후, 에이전트가 코드를 받기 전에 실행됩니다. Gateway가 MCP Server를 위한 Entra의 OAuth 클라이언트가 됩니다. Leg 1의 Entra 세션 덕분에 조용히 처리됩니다(SSO).'],
  ['에이전트 토큰','에이전트가 자신의 OAuth 흐름을 마치고 Gateway가 발급한 토큰을 받습니다. Idira나 Entra가 발급한 토큰이 아닙니다.'],
  ['도구 호출 → Graph','모든 도구 호출은 Gateway를 거칩니다: 정책 검사 후 헤더 교체(GA1 자격 증명 중개). MCP Server는 Entra OBO로 사용자로서 Microsoft Graph를 호출하며, 추가 로그인은 없습니다.'],
  ['거부된 호출','같은 에이전트, 같은 사용자, 정책이 허용하지 않는 도구. Gateway가 차단하며 백엔드에는 도달하지 않습니다.'],
  ['감사 추적','모든 홉에 증거가 남습니다: 어떤 사용자, 어떤 에이전트, 어떤 도구, 어떤 결정.'] ],
 steps:[
  {t:'SAML 신뢰 (메타데이터 교환)',title:'Idira와 Entra ID 페더레이션 (SAML 2.0)',desc:'관리자가 <b>Idira 콘솔</b>에서 Entra ID를 SAML IdP로 연결합니다. Entra에는 Idira용 엔터프라이즈 앱(SP Entity ID + ACS URL)이 생성되고, Idira는 Entra의 페더레이션 메타데이터(SSO URL, 서명 인증서)를 가져옵니다.'},
  {t:'CIE 디렉터리 동기화 (사용자 + 그룹)',title:'Cloud Identity Engine으로 Entra 사용자·그룹을 AI Gateway에 동기화',desc:'Entra ID를 <b>두 번째로</b> 연결합니다. 이번에는 Cloud Identity Engine(CIE)에 연결하여 AIS 정책이 사용자와 그룹(예: <i>Finance users</i>)을 참조할 수 있게 합니다. SCM에서 구성: <b>AI Security → AI Gateway → Admin Settings → Authentication → Configure in CIE</b>. CIE는 5분마다 동기화합니다.',note:'Idira와 CIE는 서로 통신하지 않습니다. 둘 다 같은 Entra 테넌트에 연결되며 <b>같은 사용자 속성</b>(userPrincipalName)을 써야 합니다. 그렇지 않으면 Gateway가 토큰의 사용자와 정책의 사용자를 매칭할 수 없습니다. 새 사용자는 인식되기까지 최대 5분이 걸릴 수 있습니다.'},
  {t:'앱 등록: MCP API + GW 클라이언트',title:'Entra ID에 MCP Server와 Gateway 등록',desc:'앱 등록은 두 개입니다:<ul><li><b>MCP Server API</b>: 위임 scope <code>mcp.tools</code>를 노출하고, Graph 위임 권한과 자체 자격 증명(OBO용)을 가집니다.</li><li><b>AI Gateway – MCP client</b>: 기밀 클라이언트이며, 리디렉션 URI는 Gateway의 Leg 2 콜백이고, <code>mcp.tools</code>를 요청할 수 있습니다.</li></ul>',note:'MCP Server의 Graph 권한에 <b>관리자 동의</b>를 부여하세요. OBO는 동의 화면을 띄울 수 없으므로 동의가 없으면 <code>consent_required</code>로 실패합니다.'},
  {t:'PRM 게시 · Entra 토큰 신뢰',title:'MCP Server: 보호 리소스 메타데이터 + 토큰 검증',desc:'MCP 권한 부여 사양에 따라 서버는 Entra ID를 권한 부여 서버로 알리고, Entra가 발급한 JWT(issuer, audience, scope, JWKS 서명)를 검증합니다.'},
  {t:'MCP Registry + AIS 정책',title:'AI Gateway에 MCP Server 등록 (SCM)',desc:'<b>MCP Registry → OAuth Metadata</b>에 관리자가 "AI Gateway – MCP client" 앱의 <b>사전 등록된</b> client_id/secret을 입력하고, 서버를 워크스페이스에 할당하며, AIS 정책(에이전트 × 사용자 × 도구)을 정의합니다.',note:'Entra ID는 동적 클라이언트 등록(RFC 7591)을 지원하지 않으므로 사전 등록 클라이언트 방식만 사용할 수 있습니다.'},
  {t:'데이터 플레인에 구성 배포',title:'구성이 Gateway 데이터 플레인에 반영',desc:'SCM은 에이전트, MCP 서버, 정책의 단일 관리 플레인입니다. Gateway 데이터 플레인(SaaS 또는 고객 운영 하이브리드)이 이를 집행합니다.'},
  {t:'에이전트 등록',title:'관리자가 SCM에서 AI Agent 등록',desc:'Agent Identity → Register. 리디렉션 URL은 정확히 일치해야 합니다. 클라우드 에이전트는 공개 엔드포인트, 로컬 에이전트는 <code>http://localhost:&lt;port&gt;/callback</code>을 사용합니다.'},
  {t:'에이전트 + OAuth 클라이언트 생성',title:'SAI가 Idira에 에이전트 ID 생성',desc:'Register를 누르면 SCM이 SAI를 연속 호출합니다. SAI는 Idira에 에이전트를 만들고 OAuth 클라이언트(<code>ai_agent_&lt;uuid&gt;</code>, authorize URL에 표시됨)를 생성합니다.'},
  {t:'Agent ID · client_id · secret',title:'ID와 자격 증명 반환'},
  {t:'secret은 한 번만 표시',title:'client_secret은 한 번만 표시됩니다',desc:'시크릿 관리 도구에 저장하세요. 분실하면 에이전트를 삭제 후 다시 등록해야 합니다(GA1에는 교체 기능 없음).'},
  {t:'클라이언트 자격 증명 + GW MCP URL 설정',title:'에이전트 구성',desc:'에이전트는 Gateway MCP 엔드포인트와 자신의 client_id/secret만 받습니다. Entra, Idira, MCP Server의 자격 증명은 절대 받지 않습니다.',note:'GA1은 클라이언트 / 엔드포인트형 에이전트를 공식 지원하지 않습니다. 이 흐름의 localhost 리디렉션은 설명용입니다.'},
  {t:'POST /mcp (토큰 없음)',title:'토큰 없이 첫 MCP 요청'},
  {t:'401 + WWW-Authenticate',title:'Gateway가 에이전트에 인증 요구'},
  {t:'GET PRM + AS 메타데이터',title:'에이전트가 Gateway의 /authorize와 /token 발견',desc:'에이전트가 보는 권한 부여 서버는 Gateway 자체이며, Idira와 Entra는 그 뒤에 있습니다.'},
  {t:'브라우저 열기 → GW /authorize',title:'에이전트가 OAuth 2.1 + PKCE 시작',desc:'에이전트가 PKCE verifier/challenge(S256)를 생성하고 사용자 브라우저에서 Gateway의 authorize 엔드포인트를 엽니다.'},

  {t:'GET Idira /authorize',title:'브라우저가 Idira에 도달'},

  {t:'로그인 + MFA',title:'사용자가 Entra ID에서 인증 — 유일한 대화형 로그인',desc:'Entra가 조건부 액세스와 MFA를 평가한 뒤 <b>세션 쿠키</b>를 설정합니다. 이후 Leg 2가 이 세션을 재사용합니다.'},

  {t:'정책 사전 검사 · 공유 워크스페이스',title:'Gateway가 이 조합의 접근 범위 평가',desc:'<ul><li><b>사용자</b>, <b>에이전트</b>(Workspace Access), <b>MCP 서버</b>가 공유하는 워크스페이스 → Finance-AI</li><li>AIS 정책이 alice + AI Agent 허용</li></ul>'},
  {t:'동의 페이지',title:'동의 페이지',desc:'공유 워크스페이스와 요청된 scope(예: <code>mcp:servers:read …</code>)만 표시됩니다.'},
  {t:'승인',title:'사용자 승인'},
  {t:'302 → Entra /authorize (MCP scope)',title:'Gateway가 Entra의 OAuth 클라이언트로 Leg 2 시작',desc:'Leg 2는 같은 브라우저 흐름 안에서, 동의 이후 에이전트가 코드를 받기 전에 진행됩니다.',note:'Entra를 MCP 권한 부여 서버로 쓰는 구성은 <b>검증되지 않았습니다</b>. QA 데모는 Keycloak을 사용했습니다. Entra v2는 RFC 8707 <code>resource</code> 파라미터가 아니라 scope 접두사로 API를 식별합니다. Gateway가 이 요청을 어떻게 구성하는지 확인하세요.'},
  {t:'기존 세션 → SSO',title:'조용한 SSO — 비밀번호도 MFA도 없음',desc:'Leg 1의 Entra 세션 쿠키를 재사용하므로 두 번째 로그인이 없습니다. <code>mcp.tools</code>에 관리자 동의가 없을 때만 동의 화면이 나타납니다.'},
  {t:'302 코드 → GW',title:'Entra가 Gateway용 코드 반환'},
  {t:'GET /oauth/callback',title:'코드가 Gateway에 도착'},
  {t:'POST /token (코드 + client secret)',title:'Gateway가 사전 등록 클라이언트로 코드 교환'},
  {t:'MCP access + refresh 토큰',title:'MCP 토큰을 (사용자, 서버) 단위로 Gateway 볼트에 저장',desc:'Gateway는 (alice, mcp-server) 단위로 access/refresh 토큰을 보관합니다. 에이전트는 이를 볼 수 없습니다.'},
  {t:'302 → localhost/callback?code',title:'Gateway가 마침내 에이전트의 코드 발급'},
  {t:'코드 전달',title:'에이전트가 인가 코드 수신'},
  {t:'POST /token (코드 + verifier + secret)',title:'에이전트가 코드 교환: client_secret은 여기서 한 번만 사용',desc:'client_secret이 사용되는 유일한 곳이며, 도구 호출에는 절대 전송되지 않습니다. 사용자 로그인 없이는 클라이언트 자격 증명만으로 아무것도 할 수 없습니다(GA1에는 client-credentials 그랜트 없음).'},
  {t:'GW 액세스 토큰',title:'에이전트가 Gateway 자체 발급 토큰을 받음',desc:'토큰 두 개, 대상 두 개: Idira 토큰은 Gateway에 남고, 에이전트는 Gateway에서만 유효한 Gateway 발급 토큰을 가집니다.'},

const TAKEAWAYS_EN = `
<li><b>One interactive sign-in.</b> The user signs in to Entra (via Idira, SAML) once in Leg 1. Leg 2 and Graph access reuse it through Entra SSO and OBO.</li>
<li><b>Four tokens, four audiences, none forwarded past its audience:</b> GW token (agent → GW) · Idira token (stays at GW) · MCP token (GW → MCP) · Graph token (MCP → Graph).</li>
<li><b>Agent identity is enforced at the Gateway</b> through policy and audit. Downstream tokens carry the user (+ Gateway / MCP app), not the agent, because GA1 has no token swap.</li>
<li><b>Deny happens before any backend credential is used.</b> The agent never holds Entra, MCP or Graph credentials.</li>
<li><b>Verified in the PoC (Nov 6, Keycloak as the Leg 2 AS):</b> Leg 2 ordering, pre-registered client, PRM + RFC 8414 path-insertion discovery, <code>resource</code> + PKCE, per-(user, server) token reuse, agent-level deny. <b>For Entra:</b> override the AS endpoints and set the Application ID URI to the MCP URL.</li>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function hiHttp(s){
  return esc(s)
    .replace(/^(HTTP\/1\.1 \d+[^\n]*|GET|POST|Set-Cookie:|Location:|Authorization:|WWW-Authenticate:)/gm,'<span class="h">$1</span>')
    .replace(/(→ (ALLOW|DENY))/g, m => `<span class="h">${m}</span>`);
}
function hiJson(o){

    .replace(/&quot;([^&]+?)&quot;:/g,'<span class="k">"$1"</span>:')
    .replace(/: &quot;(.*?)&quot;/g,': <span class="s">"$1"</span>');
}

function wallet(upto){
  const w = Object.fromEntries(LANES.map(l=>[l.id,[]]));
  for(let i=0;i<=upto;i++){
    const s=STEPS[i];
    (s.give||[]).forEach(([l,t])=>{ if(!w[l].includes(t)) w[l].push(t); });
    (s.take||[]).forEach(([l,t])=>{ w[l]=w[l].filter(x=>x!==t); });
  }
  return w;
}

    svg += `<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v.c}"/></marker>`;
  svg += `<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  LANES.forEach(l=>{ svg += `<line x1="${x(l.id)}" y1="6" x2="${x(l.id)}" y2="${H-6}" stroke="${l.color}" stroke-opacity=".22" stroke-dasharray="3 5"/>`; });
  svg += `<text x="12" y="20" fill="#5b6780" font-size="11" font-weight="700" letter-spacing="1">${esc(ui('phase').toUpperCase())} ${ph.k} · ${esc(phN(+ph.k).toUpperCase())}</text>`;

  ph.steps.forEach((st,k)=>{
    if(st.i > s.i) return;
    const isNew = st.i===s.i, y = top + k*rowH + 26, K = KINDS[st.kind];
    const lbl = `${st.n}  ${stT(st,'t')}`, tw = textW(lbl) + 16;
    let g = `<g class="${isNew&&animate?'msg-new':(isNew?'':'msg-old')}">`;
    if(st.from===st.to){
      const cx = x(st.from), bw = Math.max(tw, 120);
      g += `<g class="self" style="transform-origin:${cx}px ${y}px"><rect x="${cx-bw/2}" y="${y-13}" width="${bw}" height="26" rx="7" fill="${K.c}22" stroke="${K.c}" stroke-width="${isNew?1.8:1}" ${isNew?'filter="url(#glow)"':''}/>
            <text x="${cx}" y="${y+4}" text-anchor="middle" fill="${isNew?'#fff':'#cfd6e4'}" font-size="11.5" font-weight="${isNew?650:500}">${esc(lbl)}</text></g>`;
    } else {
      const x1 = x(st.from), x2 = x(st.to), dir = Math.sign(x2-x1);
      const sx = x1 + dir*4, ex = x2 - dir*6, len = Math.abs(ex-sx), mx = (x1+x2)/2;
      g += `<line class="ln" x1="${sx}" y1="${y}" x2="${ex}" y2="${y}" stroke="${K.c}" stroke-width="${isNew?2.4:1.6}" ${K.dash?`stroke-dasharray="${K.dash}"`:`stroke-dasharray="${len}"`} style="--len:${len}" marker-end="url(#ah-${st.kind})"/>`;
      g += `<circle cx="${x1}" cy="${y}" r="3.5" fill="${K.c}"/>`;
      if(isNew && animate) g += `<circle r="6" cy="${y}" fill="#fff" filter="url(#glow)"><animate attributeName="cx" from="${sx}" to="${ex}" dur=".75s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur=".9s" fill="freeze"/></circle>`;
      g += `<g class="lbl"><rect x="${mx-tw/2}" y="${y-22}" width="${tw}" height="17" rx="4" fill="#0a0e16" fill-opacity=".92" stroke="${isNew?K.c:'none'}" stroke-opacity=".6"/>
            <text x="${mx}" y="${y-9.5}" text-anchor="middle" fill="${isNew?'#fff':'#b8c2d6'}" font-size="11.5" font-weight="${isNew?650:500}">${esc(lbl)}</text></g>`;
      if(st.blocked){
        const bx1 = x('gw')+8, bx2 = x('graph')-8, by = y+14;
        g += `<g class="lbl"><line x1="${bx1}" y1="${by}" x2="${bx2}" y2="${by}" stroke="#ef4444" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 5"/>
          ${['mcp','entra','graph'].map(id=>`<text x="${x(id)}" y="${by+5}" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="800">✕</text>`).join('')}
          <text x="${(x('entra')+x('mcp'))/2}" y="${by+20}" text-anchor="middle" fill="#fca5a5" font-size="11">${esc(ui('blocked'))}</text></g>`;
      }
    }
    svg += g + '</g>';
  });
  svg += '</svg>';
  box.innerHTML = svg;
  const k = ph.steps.findIndex(st=>st.i===s.i), yy = top + k*rowH;
  if(yy > box.scrollTop + box.clientHeight - 90 || yy < box.scrollTop) box.scrollTo({top: Math.max(0, yy - box.clientHeight/2), behavior:'smooth'});
}

function drawDetail(ph, s){
  const tags = (s.src||[]).map(k=>`<span class="tag" style="color:${SRC[k].c};border-color:${SRC[k].c}66;background:${SRC[k].c}12">${srcT(k)}</span>`).join('');
  const K = KINDS[s.kind];
  const route = s.from===s.to ? laneN(LANES[LI[s.from]]) : `${laneN(LANES[LI[s.from]])} → ${laneN(LANES[LI[s.to]])}`;
  let h = `<div class="phase-title">${ui('phase')} ${ph.k} · ${phN(s.p)}</div><div class="phase-desc">${phD(s.p)}</div>
    <div class="stepno">${ui('step')} ${s.n} · ${route}${s.from===s.to?` · ${ui('internal')}`:` · <span style="color:${K.c}">${kindN(s.kind)}</span>`}</div>
    <h2>${stT(s,'title')||stT(s,'t')}</h2><div class="tags">${tags}</div>`;
  if(stT(s,'desc')) h += `<div class="desc">${stT(s,'desc')}</div>`;
  if(s.http) h += `<div class="tech"><div class="sec">${s.kind==='config'?ui('config'):ui('wire')}</div><pre>${hiHttp(s.http)}</pre></div>`;
  if(s.claims){ const C = CLAIMS[s.claims], T = TOKENS[C.tok];
    h += `<div class="tech"><div class="sec">${ui('claims')}</div><div class="claims-cap"><span class="dot" style="background:${T.color}"></span>${tokL(C.tok)}</div><pre>${hiJson(C.obj)}</pre><div class="desc" style="font-size:12px;color:var(--muted);margin-top:5px">${claimNote(s.claims)}</div></div>`; }
  if(stT(s,'note')) h += `<div class="note tech">${stT(s,'note')}</div>`;
  if(s.last) h += takeaways();
  $('detail').innerHTML = h; $('detail').scrollTop = 0;
}

/* ------------------------------------------------------------------ control */
function go(i, animate=true){ cur = Math.max(0, Math.min(STEPS.length-1, i)); render(animate); }
function delay(){ const s = STEPS[cur]; const base = 2600 + (s.http&&!simple?900:0) + (s.claims&&!simple?900:0) + (s.desc?400:0); return base * +$('speed').value; }
function tick(){ if(!playing) return; if(cur>=STEPS.length-1){ stop(); return; } go(cur+1); timer = setTimeout(tick, delay()); }
function play(){ if(cur>=STEPS.length-1) go(0); playing = true; render(false); clearTimeout(timer); timer = setTimeout(tick, delay()); }
function stop(){ playing = false; clearTimeout(timer); $('bPlay').textContent = cur===STEPS.length-1 ? ui('replay') : ui('play'); }
function setMode(sim){ simple = sim; document.body.classList.toggle('simple', sim); $('mSimple').classList.toggle('on',sim); $('mDetail').classList.toggle('on',!sim); }

$('bPlay').onclick = () => playing ? stop() : play();
$('bNext').onclick = () => { stop(); go(cur+1); };
$('bPrev').onclick = () => { stop(); go(cur-1); };
$('bRestart').onclick = () => { stop(); go(0); };
$('mSimple').onclick = () => setMode(true);
$('mDetail').onclick = () => setMode(false);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight'){ stop(); go(cur+1); }
  else if(e.key==='ArrowLeft'){ stop(); go(cur-1); }
  else if(e.key===' '){ e.preventDefault(); playing?stop():play(); }
  else if(e.key==='Home'){ stop(); go(0); }
  else if(e.key==='End'){ stop(); go(STEPS.length-1); }
  else if(e.key.toLowerCase()==='d'){ setMode(!simple); }
});
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>render(false), 120); });

function setLang(l){ lang = I18N[l] ? l : 'en'; $('lang').value = lang; buildStatic(); render(false); }
$('lang').onchange = e => setLang(e.target.value);
const hashLang = (location.hash.match(/lang=([\w-]+)/)||[])[1];
if(hashLang && I18N[hashLang]){ lang = hashLang; $('lang').value = lang; }
buildStatic();
const hashStep = parseInt((location.hash.match(/step=(\d+)/)||[])[1]);
go(isNaN(hashStep)?0:hashStep);
</script>
