*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:

.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.metric{border:1px solid var(--line);background:linear-gradient(180deg,#101827,#0c1421);border-radius:16px;padding:20px;min-height:150px}
.metric .v{font-size:30px;font-weight:800;letter-spacing:-.04em;color:white}
.metric .l{font-weight:700;margin-top:4px}.metric .n{font-size:12px;color:var(--muted);margin-top:12px}
.flow{display:grid;grid-template-columns:1fr 130px 1fr;gap:14px;align-items:stretch}
.flowbox{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:24px}
.flowbox .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.flowbox h3{font-size:22px;margin:8px 0 10px}.flowbox p{margin:0;color:#b7c5d9}
.flowbox.attacker{border-color:#425b86;background:linear-gradient(145deg,rgba(41,73,126,.36),#101827)}
.flowbox.target{border-color:#365645;background:linear-gradient(145deg,rgba(32,95,72,.24),#101827)}
.arrow{display:flex;align-items:center;justify-content:center;text-align:center;color:#92b9d8;font-size:12px;position:relative}
.arrow:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,#396184,#58e0ff,#396184)}
.arrow span{position:relative;background:var(--bg);padding:7px;z-index:1}
.not-target{margin-top:12px;border:1px dashed #5a3e46;background:#1a1118;border-radius:14px;padding:16px;color:#e8bdc5}
.not-target b{color:#ff93a3}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0d1522}
table{width:100%;border-collapse:collapse;min-width:920px}
th,td{text-align:left;vertical-align:top;padding:15px 16px;border-bottom:1px solid #1d2a3c;font-size:13px}
th{position:sticky;top:0;background:#121e2e;color:#9db0c9;font-size:11px;text-transform:uppercase;letter-spacing:.07em}
tr:last-child td{border-bottom:0} td:first-child{font-weight:800;color:#fff}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.step{position:relative;border:1px solid var(--line);background:var(--panel2);padding:18px;border-radius:15px;min-height:205px}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#19324d;border:1px solid #345d82;color:#aeeeff;font-weight:800;font-size:12px}
.step h3{font-size:15px;margin:14px 0 8px}.step p{font-size:12px;color:var(--muted);margin:0}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.rcard{border:1px solid var(--line);background:#0e1623;border-radius:15px;padding:18px}
.rcard h3{font-size:14px;margin:0 0 9px;color:#dce9fb}.rcard p{font-size:12px;color:var(--muted);margin:0}
.impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.impact{padding:18px;border-radius:15px;border:1px solid var(--line);background:#0f1725}
.impact h3{font-size:14px;margin:0 0 8px;color:#e6f0ff}.impact p{font-size:12px;color:#99a9bd;margin:0}
.priority{white-space:nowrap;font-weight:800}.priority.direct{color:#6ff0ba}.priority.extend{color:#ffce70}
.quote{border:1px solid #344964;border-left:4px solid var(--cyan);background:linear-gradient(100deg,#101b2b,#0b121d);border-radius:0 16px 16px 0;padding:22px 24px;font-size:20px;font-weight:700;color:#e7f2ff}
.motion{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.motion-card{border:1px solid var(--line);background:#0e1624;border-radius:15px;padding:16px;min-height:205px}
.motion-card .n{font-size:11px;color:var(--cyan);font-weight:800;letter-spacing:.13em}
.motion-card h3{font-size:15px;margin:10px 0}.motion-card p{font-size:12px;color:var(--muted);margin:0 0 12px}
.product{display:inline-block;font-size:11px;font-weight:800;color:#cfd9ff;background:#1a2140;border:1px solid #353f75;border-radius:7px;padding:4px 7px}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{display:flex;gap:11px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#0d1522;font-size:13px;color:#c2d0e2}
.q span{flex:0 0 24px;height:24px;display:grid;place-items:center;border:1px solid #35516f;border-radius:50%;font-size:10px;color:var(--cyan)}
.sources{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.source{border:1px solid #202f43;border-radius:12px;padding:12px 14px;background:#0b121e}
.source .meta{font-size:10px;color:#7388a2;margin-bottom:3px}.source a{font-size:12px;font-weight:700}
.note{margin-top:12px;padding:14px;border-radius:12px;background:#17151a;border:1px solid #3f3941;color:#a9a1aa;font-size:11px}
footer{padding:38px 0 55px;color:#61738b;font-size:11px;text-align:center}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.navrow a{font-size:11px;color:#9cb0c9;border:1px solid #26364b;background:#0c1420;padding:7px 10px;border-radius:8px}
.hr{height:1px;background:linear-gradient(90deg,transparent,#26364b,transparent);margin-top:32px}
@media(max-width:900px){
 .grid6{grid-template-columns:repeat(2,1fr)}

@media(max-width:620px){
 .wrap{width:min(100% - 24px,1220px)} .hero{padding-top:44px}

}
@media print{
 .topbar{position:static}.lang{display:none}body{background:#fff;color:#111}.exec,.metric,.flowbox,.step,.rcard,.impact,.motion-card,.q,.source,.table-wrap{box-shadow:none}
}
</style>

身；AI 改變的是攻擊者發現和利用弱點的經濟模型。銀行需要從「保護核心系統」升級到「持續發現整個外部攻擊面，並以機器速度預防、偵測和回應」。", "motionTitle": "建議 Sales / Security Workshop 路徑", "motion": [["01", "Exposure Baseline", "以攻擊者視角盤點網際網路暴露資產、Partner/Employee Portal、舊網域、API 與第三方系統。", "Xpanse"], ["02", "Web & API Control", "驗證認證繞過、BOLA/IDOR、資料暴露、異常枚舉和 API Shadowing 風險。", "API Security / WAAS"], ["03", "Patch Gap Defense", "識別高暴露資產與無法立即修補的關鍵系統，設計 Virtual Patching。", "ATP Plus / Frontier Virtual Patching"], ["04", "Machine-Speed SOC", "用跨域資料關聯和自動化調查驗證從首次探測到阻斷的 MTTD / MTTR。", "XSIAM"], ["05", "Secure Bank AI", "盤點銀行內部 Agent / Copilot / MCP / LLM 使用，治理身分、權限、工具呼叫與資料。", "Prisma AIRS"]], "discoveryTitle": "關鍵 Discovery Questions", "questions": ["是否有從網際網路攻擊者視角持續更新的資產清單？是否包括員工 Portal、代理/募集人 Portal、測試環境、舊網域和第三方 Cloud？", "這些周邊系統是否採用與核心網銀同等級的認證、存取控制、API 防護、日誌和威脅防護？", "對參數枚舉、異常 Query Volume、認證繞過、多國 IP 輪換存取，是否能即時識別並自動阻斷？", "一個資產出現攻擊跡象後，威脅情報能否在分鐘級自動作用到其他資產和控制點？", "高危弱點無法立即 Patch 時，是否具備網路側 Virtual Patching / Compensating Control？", "內部哪些 AI Agent 能存取原始碼、客戶資料、API、終端或 MCP 工具？是否有統一身分、最小權限和稽核？"], "sourcesTitle": "主要公開來源", "sourceNote": "註：事件仍在調查中。不同媒體統計口徑可能隨調查更新；頁面中的「約 68,000」採用 WSJ 截至 2026-10-07 的彙總口徑。關於 ARTEX，早期公開報導曾明確表示「是否實際使用尚未確認」，後續 WSJ 報導則將其描述為攻擊所使用的工具；因此頁面保留調查階段的事實邊界。", "direct": "直接商機", "extended": "延伸商機", "footer": "Prepared for security opportunity analysis • Dark-mode interactive briefing • Language switch supported"}, "en": {"langName": "English", "eyebrow": "SOUTH KOREA BANK AI-POWERED CYBER INCIDENT", "title": "AI-Powered Cyberattacks on South Korean Financial Institutions", "subtitle": "Incident facts, impact, root cause, required security capabilities and Palo Alto Networks solution mapping", "updated": "Updated through Oct 7, 2026 | Based on public reporting, Korea FSC statements and Palo Alto Networks official materials", "executiveTitle": "Executive assessment", "executive": "This is not primarily a case of a bank AI system being compromised. Public evidence indicates that AI was mainly on the attacker side: autonomous penetration tooling such as ARTEX was reportedly used or suspected to accelerate asset discovery, vulnerability testing, attack-path planning and repeated exploitation. The targets were mainly conventional web, API, employee and partner-facing business systems.", "aiTargetBadge": "Bank AI systems: no public evidence they were the primary target", "traditionalBadge": "Traditional business systems: multiple confirmed affected systems", "metricsTitle": "Key disclosed data", "metric1v": "≥ 7", "metric1l": "financial institutions with data exposure", "metric1n": "WSJ / Korean public reporting", "metric2v": "≈ 68,000", "metric2l": "individuals whose data was compromised", "metric2n": "WSJ aggregate figure", "metric3v": "≈ 25,000", "metric3l": "Shinhan customers affected", "metric3n": "loan-related customer data", "metric4v": "119", "metric4l": "KB Kookmin customers", "metric4n": "employee mobile support system", "metric5v": "89", "metric5l": "Hana customers", "metric5n": "business support system", "metric6v": "Machine speed", "metric6l": "AI agents change attack tempo", "metric6n": "discover → validate → exploit loops", "whatTitle": "What was actually targeted?", "attackerSide": "Attacker side", "attackerBoxTitle": "AI / Autonomous Agent", "attackerBoxBody": "ARTEX-related evidence; tooling can support vulnerability discovery, attack-path planning, parallel validation and repeated exploitation. Early Yonhap reporting cautioned that actual ARTEX use was not yet confirmed; later WSJ reporting described it as used in the attacks.", "arrow": "AI increases attack speed and scale", "targetSide": "Primary bank-side target surface", "targetBoxTitle": "Traditional Web / API / Peripheral Business Systems", "targetBoxBody": "Loan-broker/recruiter lookup services, employee mobile support, ODS/business support systems, external pages and servers tied to third-party software.", "notTargetTitle": "No public confirmation so far", "notTargetBody": "There is no public evidence that internal bank LLMs, RAG systems, vector databases, enterprise AI agents, model APIs or AI gateways were the primary entry points or primary targets in this campaign.", "institutionsTitle": "Disclosed institutions and incident details", "thOrg": "Institution", "thSystem": "Affected / targeted system", "thImpact": "Disclosed impact", "thSignal": "Security signal", "institutions": [["Shinhan Bank", "Loan-broker/recruiter-related lookup services and some mobile services", "About 25,000 customers; reporting cites names, phone numbers, annual income, loan limits and other data", "Public notice referenced unauthorized external access through abnormal methods; authentication and access control are central remediation themes"], ["KB Kookmin Bank", "Employee mobile business support system", "119 customers' personal/credit information", "Peripheral employee system rather than core transaction system; illustrates uneven protection between core and side-door systems"], ["Hana Bank", "ODS / business support system", "89 customers", "Traditional business support system, not an AI application"], ["BNK Busan Bank", "Outsourcing/peripheral web-related system", "Personal information of 11 contractors", "Third-party and outsourcing boundaries are part of the attack surface"], ["Yegaram Savings Bank", "Server associated with an external software solution", "Reporting indicates about 40,000 customers", "Highlights third-party software and patch-window exposure"], ["Hyundai Capital", "Mortgage recruiter-related lookup page", "Reporting indicates about 146 recruiters", "Internet-facing external page became an attack entry point"], ["Welcome Savings Bank", "Corporate customer-related system", "Reporting indicates up to about 2,200 related records", "Peripheral business-system exposure and access-control risk"], ["Woori / NH NongHyup", "Similar access attempts", "Public reporting says attempts were blocked; no confirmed leakage", "Useful control-effectiveness comparison cases"]], "chainTitle": "Attack chain and root cause", "chainSteps": [["1", "Discover exposed assets", "AI agents can continuously enumerate internet-facing assets, legacy domains, partner entry points and non-core business pages."], ["2", "Identify weaknesses", "Authentication bypass, access-control flaws, parameter enumeration, unpatched vulnerabilities or third-party software become low-cost entry points."], ["3", "Automate validation and iteration", "Agents can adapt to responses, test in parallel and retain attack context across steps."], ["4", "Scale access / data retrieval", "Once a viable path is found, it can be repeated rapidly against similar interfaces, pages or institutions."], ["5", "Exploit the defender speed gap", "Periodic scanning, human SOC queues, manual tickets and traditional patch cycles struggle to match machine-speed attacks."]], "rootTitle": "Root cause layers", "rootCards": [["Direct technical root cause", "Exploitable gaps in authentication, authorization, data exposure or software vulnerabilities. AI itself is not the vulnerability."], ["Architectural root cause", "Peripheral business systems, employee/partner portals and third-party components may have weaker controls than core banking."], ["Operational root cause", "Asset discovery, patching, investigation and response remain too dependent on periodic checks and human workflows."], ["Structural shift", "AI agents compress the attacker's discover–validate–exploit loop to machine speed and materially reduce attack cost."]], "impactTitle": "Business and security impact", "impacts": [["Customer-data risk", "Income, loan-limit, contact and identity data can enable targeted fraud, social engineering and follow-on attacks."], ["Regulatory pressure", "Korea's FSC ordered immediate reviews of externally exposed systems and services, with emphasis on authentication and access control."], ["Attack-surface reset", "Secure core banking does not equal secure enterprise attack surface; peripheral systems can be the more practical entry path."], ["Shrinking patch window", "AI accelerates vulnerability discovery and exploitation, putting pressure on the traditional CVE → assess → test → deploy cycle."], ["SOC speed challenge", "Small signals spread across IPs, assets and time need automated correlation or they can remain fragmented in analyst queues."], ["Third-party risk", "Contractors, loan intermediaries, vendor software and partner systems need unified exposure and access-control governance."]], "capTitle": "Required security capabilities × Palo Alto Networks", "thGap": "Capability gap exposed", "thNeed": "Required capability", "thPalo": "Palo Alto Networks mapping", "thPri": "Priority / relevance", "capRows": [["Unknown internet-facing peripheral systems, legacy assets and third-party entry points", "Continuous External Attack Surface Management from the attacker's perspective", "Cortex Xpanse / Exposure Management", "P0 | Direct"], ["Authentication bypass, data exposure, shadow/zombie APIs", "API discovery, risk prioritization and real-time protection against auth bypass, data exposure and OWASP API Top 10 threats", "Cortex Cloud API Security + WAAS", "P0 | Direct"], ["Exploit window before an official patch can be deployed", "Inline exploit prevention and network-level virtual patching for systems that cannot be remediated immediately", "Advanced Threat Prevention Plus + Frontier Virtual Patching", "P0 | Direct"], ["Signals fragmented across network, endpoint, identity and cloud telemetry", "Unified telemetry, behavior analytics, automated investigation, cross-domain correlation and response", "Cortex XSIAM", "P0/P1 | Direct"], ["AI agents operate faster than human security operations", "Shift exposure management, detection, investigation and response from periodic/manual to continuous/automated", "Cortex XSIAM + Xpanse + Network Security", "P0/P1 | Architectural"], ["Banks are scaling their own enterprise AI agents, copilots, MCP and LLM apps", "Discover and govern agent identity, privilege, tool calls, prompt injection, data leakage and runtime behavior", "Prisma AIRS Agent Security + AI Runtime Security + AI Gateway", "P1 | Extension, not the primary direct control for this incident"]], "messageTitle": "Recommended customer narrative", "messageQuote": "AI was not the vulnerability in this incident; AI changes the economics of finding and exploiting vulnerabilities. Banks need to move from protecting only the core to continuously discovering the full external attack surface and preventing, detecting and responding at machine speed.", "motionTitle": "Recommended Sales / Security Workshop path", "motion": [["01", "Exposure Baseline", "Inventory internet-facing assets, partner/employee portals, legacy domains, APIs and third-party systems from an attacker viewpoint.", "Xpanse"], ["02", "Web & API Control", "Validate authentication bypass, BOLA/IDOR, data exposure, abnormal enumeration and API-shadowing risk.", "API Security / WAAS"], ["03", "Patch Gap Defense", "Identify exposed critical systems that cannot be patched immediately and design virtual-patching controls.", "ATP Plus / Frontier Virtual Patching"], ["04", "Machine-Speed SOC", "Use cross-domain correlation and automated investigation to validate MTTD/MTTR from first probe to containment.", "XSIAM"], ["05", "Secure Bank AI", "Inventory internal agents, copilots, MCP and LLM use; govern identity, privilege, tool calls and data.", "Prisma AIRS"]], "discoveryTitle": "Key discovery questions", "questions": ["Do you maintain a continuously updated inventory from the internet attacker's perspective, including employee portals, loan-agent portals, test environments, old domains and third-party cloud assets?", "Do peripheral systems have the same authentication, access control, API protection, logging and threat-prevention standard as core online banking?", "Can you identify and automatically block parameter enumeration, abnormal query volume, authentication bypass and rotating access from multiple countries in real time?", "When one asset shows attack activity, can threat intelligence and response actions propagate to other assets and control points within minutes?", "When a critical vulnerability cannot be patched immediately, do you have network-level virtual patching or compensating controls?", "Which internal AI agents can access source code, customer data, APIs, endpoints or MCP tools, and are identity, least privilege and audit centrally governed?"], "sourcesTitle": "Primary public sources", "sourceNote": "Note: The investigation is ongoing and figures may change. The ≈68,000 figure follows the WSJ aggregate reported through Oct. 7, 2026. Early public reporting said actual ARTEX use had not yet been confirmed, while later WSJ reporting described ARTEX as used in the attacks; this page preserves that investigative nuance.", "direct": "Direct opportunity", "extended": "Extension opportunity", "footer": "Prepared for security opportunity analysis • Dark-mode interactive briefing • Language switch supported"}, "ko": {"langName": "한국어", "eyebrow": "SOUTH KOREA BANK AI-POWERED CYBER INCIDENT", "title": "한국 금융기관 AI 기반 사이버 공격 사건", "subtitle": "사건 사실, 영향, Root Cause, 필요한 보안 역량 및 Palo Alto Networks 솔루션 매핑", "updated": "2026-10-07 기준｜공개 보도, 금융위원회 및 Palo Alto Networks 공식 자료 기반", "executiveTitle": "핵심 판단", "executive": "이번 사건은 ‘은행의 AI 시스템이 침해된 사건’으로 보는 것이 정확하지 않습니다. 현재 공개된 정황상 AI는 주로 공격자 측에 있었습니다. ARTEX와 같은 자율 침투 도구가 자산 탐색, 취약점 검증, 공격 경로 수립 및 반복 공격의 효율을 높이는 데 사용됐거나 사용된 것으로 의심되고 있으며, 실제 주요 공격 대상은 전통적인 웹, API, 임직원 및 파트너 대상 업무 시스템이었습니다.", "aiTargetBadge": "은행 AI 시스템: 주요 공격 대상이었다는 공개 근거 없음", "traditionalBadge": "전통 업무 시스템: 복수의 실제 피해 사례 확인", "metricsTitle": "공개된 핵심 수치", "metric1v": "≥ 7", "metric1l": "정보 유출이 발생한 금융기관", "metric1n": "WSJ / 국내 공개 보도", "metric2v": "≈ 68,000", "metric2l": "개인정보 영향 인원", "metric2n": "WSJ 집계 기준", "metric3v": "≈ 25,000", "metric3l": "신한은행 영향 고객", "metric3n": "대출 관련 고객 정보", "metric4v": "119", "metric4l": "KB국민은행 고객", "metric4n": "직원용 모바일 업무지원시스템", "met  "접근/데이터 획득 확장", "유효한 경로를 찾으면 유사 인터페이스, 페이지 또는 기관에 빠르게 반복할 수 있습니다."], ["5", "방어 속도 격차 악용", "주기적 스캔, 수동 SOC 큐, 수동 티켓 및 전통적 패치 주기는 머신 스피드 공격을 따라가기 어렵습니다."]], "rootTitle": "Root Cause 계층", "rootCards": [["직접 기술 원인", "인증, 권한, 데이터 노출 또는 소프트웨어 취약점에 실제로 악용 가능한 빈틈이 존재했습니다. AI 자체가 취약점은 아닙니다."], ["아키텍처 원인", "주변 업무 시스템, 임직원/파트너 포털, 제3자 컴포넌트의 보안 수준이 Core Banking보다 낮을 수 있습니다."], ["운영 원인", "자산 발견, 패치, 조사 및 대응이 여전히 주기 점검과 사람 중심 프로세스에 많이 의존합니다."], ["구조적 변화", "AI Agent가 공격자의 발견–검증–악용 루프를 머신 스피드로 압축해 공격 비용을 크게 낮춥니다."]], "impactTitle": "비즈니스 및 보안 영향", "impacts": [["고객정보 위험", "연소득, 대출한도, 연락처, 신원정보는 정교한 보이스피싱·스미싱·사회공학 및 후속 공격에 활용될 수 있습니다."], ["규제 압력", "금융위원회는 외부에 노출된 전산시스템과 서비스 전반에 대한 즉각적인 보안점검과 인증·접근통제 취약점 점검을 요구했습니다."], ["공격 표면 재평가", "Core Banking이 안전하다고 해서 전체 공격 표면이 안전한 것은 아니며, 주변 시스템이 더 현실적인 침입 경로가 될 수 있습니다."], ["패치 시간창 축소", "AI가 취약점 발견과 악용을 가속하면서 기존 CVE → 평가 → 테스트 → 패치 배포 주기에 더 큰 압력이 발생합니다."], ["SOC 속도 과제", "IP, 자산, 시간대에 분산된 작은 신호를 자동 연계하지 않으면 수동 분석 큐에서 분절될 수 있습니다."], ["제3자 위험", "외주 인력, 대출 모집인, 공급업체 소프트웨어 및 파트너 시스템을 통합 공격표면 및 접근통제 거버넌스에 포함해야 합니다."]], "capTitle": "필요 보안 역량 × Palo Alto Networks 제품", "thGap": "이번 사건에서 드러난 역량 공백", "thNeed": "필요한 보안 역량", "thPalo": "Palo Alto Networks 제품 매핑", "thPri": "우선순위 / 관련성", "capRows": [["인터넷에 어떤 주변 시스템, 구형 자산, 제3자 진입점이 노출됐는지 모름", "공격자 관점의 지속적 External Attack Surface Management", "Cortex Xpanse / Exposure Management", "P0 | 직접 관련"], ["Web/API의 인증 우회, 데이터 노출, Shadow/Zombie API 위험", "API 발견, 위험 우선순위화, 인증 우회·데이터 노출·OWASP API Top 10 실시간 방어", "Cortex Cloud API Security + WAAS", "P0 | 직접 관련"], ["공식 패치 배포 전까지 악용 가능한 시간창 존재", "실시간 Exploit 차단 및 즉시 패치가 어려운 시스템에 대한 Network-level Virtual Patching", "Advanced Threat Prevention Plus + Frontier Virtual Patching", "P0 | 직접 관련"], ["네트워크·엔드포인트·아이덴티티·클라우드에 신호가 분산", "통합 텔레메트리, 행위 분석, 자동 조사, 크로스도메인 연계 및 대응", "Cortex XSIAM", "P0/P1 | 직접 관련"], ["AI Agent의 공격 속도가 사람 중심 보안운영 속도를 초과", "노출관리·탐지·조사·대응을 주기/수동 모델에서 지속/자동 모델로 전환", "Cortex XSIAM + Xpanse + Network Security", "P0/P1 | 아키텍처"], ["은행 내부에서 기업용 AI Agent, Copilot, MCP,
